# 门禁：每个 PR、每次推到 main 都在 GitHub 的干净机器上从零跑一遍全部检查。
# 它是"独立裁判"：AI 自己本地跑的绿不算数，以这里的结果为准。
name: 门禁

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 门禁 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ludi 在 Windows 上开发，所以两边都跑；Windows 分钟数按 2 倍计费，跑稳后再决定是否保留。
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/surfaces/gui/app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 GUI 依赖
        run: npm ci --prefix src/surfaces/gui/app

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 测试
        run: npx vitest run --maxWorkers=2

      - name: 构建
        run: npm run build

      - name: GUI 构建
        run: npm --prefix src/surfaces/gui/app run build

  # 把结果写成 PR 里的一条中文评论（同一条反复更新）：
  # Ludi 不用点进日志就知道哪一步没过；AI 也能直接读到出错前的日志去修（AI 的令牌读不到检查结果）。
  report:
    name: 门禁结果评论
    needs: gates
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: 汇总并评论
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/report.md"
          gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("门禁 (")) | [(.id|tostring), .name, (.conclusion // "unknown"), ([.steps[] | select(.conclusion == "failure") | .name] | join("、"))] | @tsv' \
            > "$RUNNER_TEMP/jobs.tsv"

          all_ok=true
          { echo "<!-- ci-report -->"; echo "## 门禁结果（\`${SHA:0:7}\`）"; echo ""
            echo "| 系统 | 结果 | 没过的步骤 |"; echo "| --- | --- | --- |"; } > "$out"
          sys() { case "$1" in *ubuntu*) echo Linux ;; *windows*) echo Windows ;; *) echo "$1" ;; esac; }
          while IFS=$'\t' read -r id name conclusion failed; do
            case "$conclusion" in
              success) mark="✅ 通过" ;;
              failure) mark="❌ 没通过"; all_ok=false ;;
              *) mark="⚠️ $conclusion"; all_ok=false ;;
            esac
            echo "| $(sys "$name") | $mark | ${failed:-—} |" >> "$out"
          done < "$RUNNER_TEMP/jobs.tsv"
          echo "" >> "$out"
          if $all_ok; then echo "两个系统都通过。" >> "$out"; else echo "运行记录：$RUN_URL" >> "$out"; fi

          # 没过的系统：附上第一个报错之前的 120 行日志（去掉时间戳和颜色码）
          while IFS=$'\t' read -r id name conclusion failed; do
            [ "$conclusion" = "failure" ] || continue
            log="$RUNNER_TEMP/job-$id.log"
            gh api "repos/$REPO/actions/jobs/$id/logs" > "$log" 2>/dev/null || { echo "" >> "$out"; echo "（$(sys "$name") 的日志没取到）" >> "$out"; continue; }
            sed -i -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ?//; s/\x1b\[[0-9;]*[A-Za-z]//g; s/```/ʼʼʼ/g' "$log"
            stop=$(grep -n -m1 '##\[error\]' "$log" | cut -d: -f1 || true)
            [ -n "$stop" ] || stop=$(wc -l < "$log")
            start=$(( stop > 120 ? stop - 119 : 1 ))
            { echo ""; echo "<details><summary>$(sys "$name")：出错前的日志</summary>"; echo ""; echo '```text'
              sed -n "${start},${stop}p" "$log" | cut -c1-300; echo '```'; echo ""; echo "</details>"; } >> "$out"
          done < "$RUNNER_TEMP/jobs.tsv"

          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ci-report -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$out" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$out" > /dev/null
          fi
